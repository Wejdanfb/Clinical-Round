# Render Blueprint for Clinical Round (single user).
# Creates: 1 web service + 1 PostgreSQL database.
# Secrets are NOT in this file:
#   SECRET_KEY   - generated by Render
#   APP_PASSWORD - you type it in the Render dashboard when creating the Blueprint
#   DATABASE_URL - linked automatically from the database below
services:
  - type: web
    name: clinical-round
    runtime: python
    plan: free                      # change to a paid plan to avoid cold starts
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /healthz
    autoDeploy: false               # deploy only when you choose to
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clinical-round-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: COMPLETED_ROUND_RETENTION_DAYS
        value: "7"
      - key: INACTIVE_ROUND_DAYS
        value: "30"

databases:
  - name: clinical-round-db
    plan: free                      # NOTE: Render free databases expire after 30 days - see README
    databaseName: clinical_round
    user: clinical_round
    ipAllowList: []                 # private network only - not reachable from the internet
